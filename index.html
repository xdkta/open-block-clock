<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Block Clock</title>
  <meta name="description" content="An open source bitcoin block clock. Shows the latest block height and progress to the next halving.">
  <meta name="theme-color" content="#0D0D0D">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230D0D0D'/%3E%3Crect x='6' y='22' width='20' height='4' fill='%23F7931A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-left">
        <div class="status"><span class="dot"></span><span id="status">CONNECTING</span></div>
      </div>
      <div class="logo">OPEN BLOCK CLOCK</div>
      <div class="clock">
        <button type="button" id="themeToggle" class="theme-btn" aria-label="Switch between dark and light">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(14 12 12)">
            <path d="M9.5 2.5v3M13 2.5v3M9.5 18.5v3M13 18.5v3"/>
            <path d="M6.5 5.5h7.25a3.25 3.25 0 0 1 0 6.5H6.5M8 5.5v13M6.5 12h8a3.25 3.25 0 0 1 0 6.5h-8"/>
          </g></svg>
        </button>
      </div>
    </header>

    <div class="halving">
      <div class="track" id="halvTrack" role="progressbar" aria-label="Progress to next halving"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i class="fill" id="halvFill"></i>
      </div>
    </div>

    <main class="view">
      <div class="fit"><span id="height" class="fit-text">—</span></div>
    </main>
  </div>

  <div id="flash" aria-hidden="true">
    <div class="flash-label">TICK TOCK, NEXT BLOCK</div>
    <div class="flash-height" id="flashHeight"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
